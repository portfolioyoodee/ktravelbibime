        .progress-fill {
            height: 100%; background: #000; width: 0%;

            flex-direction: column;
            justify-content: center;

            from { opacity: 0; transform: translateY(10px); }

            padding: 16px 24px;
            color: #000;
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.45;

            background: #000;
            color: #fff;
            padding: 10px 15px;

        .action-container {

            align-items: center;
            width: 100%;
            margin-top: 30px;

        .action-row {
            display: flex;

        .action-btn {
            background: #000;
            color: #fff;
            border: 1px solid #000;
            border-radius: 30px;
            padding: 18px 24px;
            font-size: 0.95rem;
            font-weight: 700;

    function changeLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${lang}`).classList.add('active');
        updateStaticText();
        if (document.getElementById('step-questions') && document.getElementById('step-questions').classList.contains('active')) { 
            renderAllQuestions(); 
        } else if (document.getElementById('step-result').classList.contains('active')) { 
            showResult(true); 
        } else if (document.getElementById('step-all-guides').classList.contains('active')) { 
            showAllGuides(); 
        } else {
            renderAllQuestions();
        }
    }

    function updateStaticText() {
        const text = i18n[currentLang];
        document.getElementById('start-sub-title').innerText = text.startSubTitle;
        document.getElementById('start-title').innerHTML = text.startTitle;
        document.getElementById('start-btn-text').innerText = text.startBtn;
        document.getElementById('start-bottom-text').innerText = text.startBottomText;

        // 시작 버튼 이미지 언어별 분기 처리
        const startBtn = document.getElementById('start-btn-text');
        if (currentLang === 'th') {
            startBtn.style.setProperty('background', "url('https://drive.google.com/thumbnail?id=1gQ6D18WpAlbMNFLshf6WcnXb1XXspHEB&sz=w500') no-repeat center center", 'important');
        } else {
            startBtn.style.setProperty('background', "url('https://drive.google.com/thumbnail?id=1fUvS64anZIvnCeD17FbQu49Nxc96vxjI&sz=w500') no-repeat center center", 'important');
        }
        startBtn.style.setProperty('background-size', 'contain', 'important');

        document.getElementById('restart-btn').innerText = text.restart;
        document.getElementById('share-btn').innerText = text.share;
        document.getElementById('share-btn-all').innerText = text.share;
        document.getElementById('all-guides-btn').innerText = text.allGuides;
        document.getElementById('back-to-result-btn').innerText = text.backResult;
        document.getElementById('all-cheat-codes-title').innerText = text.allTitle;
        document.getElementById('result-label-text').innerHTML = text.resultLabel;
        document.getElementById('cheat-codes-title').innerText = text.cheatTitle;
        updateSubmitButtonState();
    }

    function renderAllQuestions() {
        const qDataList = i18n[currentLang].questions;
        const label = i18n[currentLang].labels;

        for(let i = 1; i <= 7; i++) {
            const qIndex = i - 1;
            const qData = qDataList[qIndex];
            let partLabel = i === 1 ? label.p1 : (i <= 5 ? label.p2 : label.p3);
            
            const labelEl = document.getElementById(`label-q${i}`);
            const textEl = document.getElementById(`text-q${i}`);
            const optsContainer = document.getElementById(`opts-q${i}`);
            
            if(labelEl) labelEl.innerText = partLabel;
            if(textEl) textEl.innerText = qData.q;
            
            if(optsContainer) {
                optsContainer.innerHTML = '';
                ['A', 'B', 'C', 'D'].forEach((choice, idx) => {
                    if (qData.o[idx]) {
                        const div = document.createElement('div');
                        div.className = 'bubble';
                        if (userChoices[qIndex] === choice) {
                            div.classList.add('selected');
                        }
                        div.innerText = qData.o[idx];
                        div.onclick = () => selectOption(qIndex, choice);
                        optsContainer.appendChild(div);
                    }
                });
            }
        }
    }

    function nextStep(step) {
        if (step === 'questions') {
            const target = document.getElementById('step-questions');
            if (target) {
                const y = target.getBoundingClientRect().top + window.scrollY;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
            return;
        }

        document.querySelectorAll('.cut').forEach(el => el.classList.remove('active'));
        const targetId = step === 'result' ? 'step-result' : (step === 'all-guides' ? 'step-all-guides' : (step === 'questions' ? 'step-questions' : 'step-' + step));
        const target = document.getElementById(targetId);
        if (target) target.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        const pw = document.getElementById('progressWrapper');
        const pf = document.getElementById('progressFill');
        if (step === 'questions') {
            pw.style.display = 'block'; 
            const answeredCount = userChoices.filter(c => c !== null).length;
            pf.style.width = ((answeredCount / totalQuestions) * 100) + '%'; 
            renderAllQuestions();
        } else { 
            pw.style.display = 'none'; 
        }
        const langNav = document.querySelector('.lang-nav');
        if (langNav) { langNav.style.display = (step === 0 || targetId === 'step-0') ? 'flex' : 'none'; }
    }

    function selectOption(qIndex, choice) { 
        userChoices[qIndex] = choice; 
        renderAllQuestions();
        updateSubmitButtonState();

        const answeredCount = userChoices.filter(c => c !== null).length;
        const pw = document.getElementById('progressWrapper');
        const pf = document.getElementById('progressFill');
        if (pw && pf) {
            pw.style.display = 'block'; 
            pf.style.width = ((answeredCount / totalQuestions) * 100) + '%'; 
        }

        if (answeredCount < totalQuestions) {
            let nextUnanswered = qIndex + 1;
            while(nextUnanswered < totalQuestions && userChoices[nextUnanswered] !== null) {
                nextUnanswered++;
            }
            if(nextUnanswered < totalQuestions) {
                const nextBlock = document.getElementById(`q-block-${nextUnanswered + 1}`);
                if (nextBlock) {
                    const y = nextBlock.getBoundingClientRect().top + window.scrollY - 60;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }
            }
        } else {
            const submitSec = document.getElementById('submit-section');
            if(submitSec) {
                setTimeout(() => {
                    const y = submitSec.getBoundingClientRect().top + window.scrollY - 60;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }, 300);
            }
        }
    }

    function updateSubmitButtonState() {
        const submitBtn = document.getElementById('submit-btn');
        if(!submitBtn) return;
        
        const answeredCount = userChoices.filter(c => c !== null).length;
        if (answeredCount === totalQuestions) {
            submitBtn.innerText = i18n[currentLang].submitBtn;
            submitBtn.style.backgroundColor = '#000';
            submitBtn.style.borderColor = '#000';
            submitBtn.style.cursor = 'pointer';
            submitBtn.onclick = showResult;
        } else {
            submitBtn.innerText = i18n[currentLang].incompleteMsg;
            submitBtn.style.backgroundColor = '#888';
            submitBtn.style.borderColor = '#888';
            submitBtn.style.cursor = 'not-allowed';
            submitBtn.onclick = null;
        }
    }

    let radarChart;
    let savedWinner = 'A';

    function drawRadar(resultType) {
        const canvas = document.getElementById('radarChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const profiles = { A: [4, 5, 3, 2, 3], B: [1, 3, 4, 3, 4], C: [4, 3, 2, 2, 3], D: [3, 2, 4, 4, 3] };
        
        const rawLabels = i18n[currentLang].radarLabels;
        const dataPoints = profiles[resultType];
        const maxVal = Math.max(...dataPoints);

        // Responsive adjustments for labels
        if (currentLang === 'en') {
            canvas.style.width = '83%';
            canvas.style.height = '83%';
            canvas.style.transform = 'translateY(35px)';
        } else {
            canvas.style.width = '95%';
            canvas.style.height = '95%';
            canvas.style.transform = 'translateY(28px)';
        }

        const finalLabels = rawLabels.map((label, index) => {
            if (dataPoints[index] === maxVal) {
                if (Array.isArray(label)) {
                    const newLabel = [...label];
                    newLabel[0] = "✨ " + newLabel[0];
                    return newLabel;
                }
                return "✨ " + label;
            }
            return label;
        });

        if (radarChart) radarChart.destroy();
        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: finalLabels,
                datasets: [{ 
                    data: dataPoints, 
                    backgroundColor: 'rgba(0, 0, 0, 0.05)', 
                    borderColor: '#000', 
                    borderWidth: 2, 
                    pointBackgroundColor: dataPoints.map(v => v === maxVal ? '#D4AF37' : '#000'),
                    pointBorderColor: dataPoints.map(v => v === maxVal ? '#D4AF37' : '#000'),
                    pointRadius: 4 
                }]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: true,
                scales: { 
                    r: { 
                        suggestedMin: 0, 
                        suggestedMax: 5, 
                        ticks: { display: false, stepSize: 1 },
                        pointLabels: {
                            font: (context) => {
                                const isMax = dataPoints[context.index] === maxVal;
                                return {
                                    size: 14,
                                    weight: isMax ? 'bold' : '300',
                                    family: "'Noto Sans', sans-serif"
                                };
                            },
                            color: (context) => dataPoints[context.index] === maxVal ? '#D4AF37' : '#000',
                            padding: 5
                        }
                    } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });
    }

    function showResult(isLanguageRefresh = false) {
        if (!isLanguageRefresh) {
            const tallies = { A: 0, B: 0, C: 0, D: 0 }; 
            userChoices.forEach(c => { if(c) tallies[c]++; });
            savedWinner = Object.keys(tallies).reduce((a, b) => tallies[a] > tallies[b] ? a : b);

            // GTM DataLayer Push (SubmitForm Event for Tiktok Pixel)
            // 브라우저 탭(세션) 단위로 중복 발송 방지 로직 적용
            if (!sessionStorage.getItem('tt_SubmitForm_fired')) {
                window.dataLayer = window.dataLayer || [];
                window.dataLayer.push({
                    'event': 'SubmitForm'
                });
                sessionStorage.setItem('tt_SubmitForm_fired', 'true');
            }
        }
        
        const resData = i18n[currentLang].results[savedWinner];
        document.getElementById('res-tag').innerText = resData.tag;
        document.getElementById('res-title').innerText = resData.title;
        document.getElementById('res-desc').innerText = resData.desc;
        
        const cheats = i18n[currentLang].cheats[savedWinner];
        const prefix = i18n[currentLang].cheatCodePrefix;
        const grid = document.getElementById('dynamicGuideGrid');
        grid.innerHTML = '';
        cheats.forEach((c, idx) => {
            const panel = document.createElement('div'); 
            panel.className = 'guide-panel';
            const list = c.i.map(li => `<li>${li}</li>`).join('');
            panel.innerHTML = `<div class="guide-num">${prefix} #${idx + 1}</div><div class="guide-title">${c.t}</div><ul>${list}</ul><div class="guide-tip">${c.tip}</div>`;
            grid.appendChild(panel);
        });
        
        nextStep('result'); 
        drawRadar(savedWinner);
    }

    function showAllGuides() {
        const container = document.getElementById('allGuidesContainer');
        container.innerHTML = '';
        const prefix = i18n[currentLang].cheatCodePrefix;
        ['A', 'B', 'C', 'D'].forEach(type => {
            const header = document.createElement('div');
            header.className = 'type-header';
            header.innerText = i18n[currentLang].results[type].title;
            container.appendChild(header);
            const guideGrid = document.createElement('div');
            guideGrid.className = 'guide-grid';
            i18n[currentLang].cheats[type].forEach((c, idx) => {
                const panel = document.createElement('div');
                panel.className = 'guide-panel';
                const list = c.i.map(li => `<li>${li}</li>`).join('');
                panel.innerHTML = `<div class="guide-num">${prefix} #${idx + 1}</div><div class="guide-title">${c.t}</div><ul>${list}</ul><div class="guide-tip">${c.tip}</div>`;
                guideGrid.appendChild(panel);
            });
            container.appendChild(guideGrid);
        });
        nextStep('all-guides');
    }

    function shareLink(btnId) {
        const url = window.location.href.split('?')[0] + '?utm_source=share';
        const tempInput = document.createElement('input');
        tempInput.value = url; 
        document.body.appendChild(tempInput);
        tempInput.select(); 
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        
        const shareBtn = document.getElementById(btnId);
        const originalText = shareBtn.innerText;
        shareBtn.innerText = currentLang === 'en' ? "Copied!" : "คัดลอกแล้ว!";
        setTimeout(() => { shareBtn.innerText = originalText; }, 2000);
    }

    window.onload = () => {
        updateStaticText();
        renderAllQuestions();
        const pw = document.getElementById('progressWrapper');
        if (pw) pw.style.display = 'block';
    };
</script>
